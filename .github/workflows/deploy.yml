name: Build, Push & Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build -t harriputtar/portfolio-app:latest .

      - name: Push Docker image
        run: |
          docker push harriputtar/portfolio-app:latest

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            APP_DIR="${{ secrets.EC2_APP_DIR }}"

            if [ -z "$APP_DIR" ]; then
              COMPOSE_FILE=$(find "$HOME" -maxdepth 3 -type f -name "docker-compose.yml" | head -n 1)
              if [ -z "$COMPOSE_FILE" ]; then
                echo "docker-compose.yml not found under $HOME"
                exit 1
              fi
              APP_DIR=$(dirname "$COMPOSE_FILE")
            else
              COMPOSE_FILE="$APP_DIR/docker-compose.yml"
            fi

            if [ ! -f "$COMPOSE_FILE" ]; then
              echo "docker-compose.yml not found at $COMPOSE_FILE"
              exit 1
            fi

            cd "$APP_DIR"
            echo "Deploying from $APP_DIR"
            docker compose -f "$COMPOSE_FILE" pull
            docker compose -f "$COMPOSE_FILE" up -d --remove-orphans
